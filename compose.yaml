name: ${COMPOSE_PROJECT_NAME:-cadentra-platform}

x-backend: &backend
  build:
    context: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cadentra}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-cadentra_platform}
    SMTP_HOST: ${COMPOSE_SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
  init: true

services:
  mailpit:
    image: axllent/mailpit:v1.33.0
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - mailcapture:/data
    # Development capture only. No relay/forwarding or public inbox is configured.

  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cadentra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cadentra_platform}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    # PostgreSQL has no published port. Native mode uses a separately supplied DB.

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    profiles: ["web"]
    ports:
      - "127.0.0.1:${WEB_PORT:-5171}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Immutable non-root static image; /api is proxied to api:8001 unchanged.

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    profiles: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped
    # Explicit profile runs one supervised lifecycle/billing/outbox worker.
    # Keep replicas at one; database locks/uniqueness remain authoritative.

volumes:
  database:
  mailcapture:
