<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171b1a" />
    <meta name="description" content="Cadentra subscription operations for Brightloop Software." />
    <title>Cadentra</title>
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('cadentra:theme') === 'light' ? 'light' : 'dark'; }
      catch { document.documentElement.dataset.theme = 'dark'; }
      document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.theme === 'light' ? '#f2f4ef' : '#171b1a';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
