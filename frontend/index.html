<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171b1a" />
    <meta name="description" content="Subscriptions, billing and customer relationships. Beautifully connected." />
    <meta property="og:title" content="Cadentra — Every cycle. Under control." />
    <meta property="og:description" content="Plans, quotations, billing and customer relationships in one connected workspace." />
    <meta property="og:image" content="https://cadentra.midhunpm.in/assets/home/hero.webp" />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://cadentra.midhunpm.in/" />
    <link rel="preload" as="image" href="/assets/home/hero.webp" imagesrcset="/assets/home/hero-small.webp 960w, /assets/home/hero.webp 1672w" imagesizes="100vw" />
    <title>Cadentra — Every cycle. Under control.</title>
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('cadentra:theme') === 'light' ? 'light' : 'dark'; }
      catch { document.documentElement.dataset.theme = 'dark'; }
      document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.theme === 'light' ? '#f2f4ef' : '#171b1a';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
