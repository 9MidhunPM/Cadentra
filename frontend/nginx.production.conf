# Production-only identity contract. Traefik must first enforce Cloudflare's
# source-range allowlist using its original socket RemoteAddr, not forwarded IPs.
map $realip_remote_addr $cadentra_trusted_ingress_peer {
    default 0;
    10.0.1.20 1;
}

# Duplicate headers are exposed as a comma-separated value by NGINX. These
# shapes reject commas, whitespace, brackets and IPv4:port; realip then parses
# the address. Requiring an actual rewrite below rejects invalid IP literals.
map $http_cf_connecting_ip $cadentra_single_cf_address {
    default 0;
    "~^(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$" 1;
    "~^[0-9A-Fa-f:]+:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$" 1;
    ~^[0-9A-Fa-f:]*:[0-9A-Fa-f:]*:[0-9A-Fa-f:]*$ 1;
}

# Docker's internal DNS keeps the proxy valid when the API container is replaced.
upstream cadentra_api {
    zone cadentra_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8001 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    set_real_ip_from 10.0.1.20;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # No trusted-header fallback: malformed/missing identities and direct peers
    # cannot reach static content or the API. Health checks must use the agreed
    # local configuration/process contract, never a public HTTP bypass.
    if ($cadentra_trusted_ingress_peer = 0) { return 403; }
    if ($cadentra_single_cf_address = 0) { return 403; }
    if ($realip_remote_addr = $remote_addr) { return 403; }
    # Password-reset links carry query tokens; do not emit them in access logs.
    access_log off;

    # Do not strip /api, intercept errors, or cache authenticated responses.
    # Origin, Cookie and X-CSRF-Token pass through with the request headers.
    location = /api {
        proxy_pass http://cadentra_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Overwrite every incoming instance with one validated identity field.
        proxy_set_header X-Cadentra-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_intercept_errors off;
        proxy_cache off;
    }
    location ^~ /api/ {
        proxy_pass http://cadentra_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Overwrite every incoming instance with one validated identity field.
        proxy_set_header X-Cadentra-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_intercept_errors off;
        proxy_cache off;
    }

    # Vite emits content-hashed files here. Missing chunks must remain real 404s.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_vary on;
    }

    # A new deployment must not leave clients using an old chunk manifest.
    location = /index.html {
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ /index.html;
        # Repeat here: a location's Cache-Control replaces inherited add_header rules.
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache";
    }
}
