# Dokploy Git provider: repository root, Compose path ./compose.dokploy.yaml.
# Configure the private environment in Dokploy; publish only web:8080 as a domain.
x-backend-environment: &backend-environment
  APP_ENV: production
  APP_ORIGIN: ${APP_ORIGIN:?Set the HTTPS app origin in the private Dokploy environment}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set explicit HTTPS allowed origins privately}
  SESSION_COOKIE_SECURE: "true"
  TRUSTED_WEB_PROXY_IPS: "172.31.250.2"
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cadentra}:${POSTGRES_PASSWORD:?Set the database password privately}@db:5432/${POSTGRES_DB:-cadentra_demo}
  BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Kolkata}
  BUSINESS_CURRENCY: INR
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
  RESET_TOKEN_TTL_SECONDS: ${RESET_TOKEN_TTL_SECONDS:-1800}
  SMTP_HOST: ${COMPOSE_SMTP_HOST:-smtp.resend.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-resend}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-30}
  WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-100}

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment: *backend-environment
  init: true

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cadentra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the database password privately}
      POSTGRES_DB: ${POSTGRES_DB:-cadentra_demo}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bootstrap:
    <<: *backend
    environment:
      <<: *backend-environment
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:?Set the generated demo admin email privately}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set a generated compliant demo admin password privately}
    command: ["python", "-m", "app.seed", "--demo"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    # Repeated runs preserve existing data/passwords. Credentials never enter Git.

  api:
    <<: *backend
    networks:
      default: {}
      proxy:
        ipv4_address: 172.31.250.3
        aliases:
          - cadentra-api-proxy
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    # Exactly one service instance; do not add a second native worker.

  web:
    environment:
      CADENTRA_TRUSTED_INGRESS: "true"
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.cadentra-demo-http.rule: Host(`cadentra.midhunpm.in`)
      traefik.http.routers.cadentra-demo-http.entrypoints: web
      traefik.http.routers.cadentra-demo-http.service: cadentra-demo-web
      traefik.http.routers.cadentra-demo-http.middlewares: cadentra-cloudflare-only@docker,cadentra-demo-https@docker
      traefik.http.middlewares.cadentra-demo-https.redirectscheme.scheme: https
      traefik.http.routers.cadentra-demo-https.rule: Host(`cadentra.midhunpm.in`)
      traefik.http.routers.cadentra-demo-https.entrypoints: websecure
      traefik.http.routers.cadentra-demo-https.service: cadentra-demo-web
      traefik.http.routers.cadentra-demo-https.middlewares: cadentra-cloudflare-only@docker
      traefik.http.routers.cadentra-demo-https.tls: "true"
      traefik.http.routers.cadentra-demo-https.tls.certresolver: letsencrypt
      traefik.http.services.cadentra-demo-web.loadbalancer.server.port: "8080"
      traefik.http.middlewares.cadentra-cloudflare-only.ipallowlist.sourcerange: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: 172.31.250.2
      dokploy-network: {}
    restart: unless-stopped
    # Dokploy Domains routes HTTPS only to this service's internal port 8080.

volumes:
  database:
  # Retain historical capture data; removal of the service must not delete this volume.
  mailcapture:

networks:
  default:
  proxy:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/29
  dokploy-network:
    external: true
